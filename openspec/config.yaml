# OpenSpec project configuration for a Terraform module repository
# (template from the profiles repository, profile terraform-module).
# `context` is injected into every planning artifact; keep it to what is
# specific to THIS module. Engineering standards are not repeated here: they
# are fetched on demand from the referenced stores (quality, repository, terraform) (see the index that
# `openspec instructions` prints). `mise run spec-setup` registers the stores.
schema: spec-driven

# `ref` pins each store to a released tag (openspec-consumption); the setup
# script clones at that tag and reports a registered checkout on another commit.
references:
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.6
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v4.1.0
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.6

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that creates one Scaleway Managed
  Database (RDB) instance (PostgreSQL 11-17 or MySQL 8) with encryption at
  rest and automated backups on by default, and, on that instance, databases,
  users, privileges, ACL rules, manual backups and read replicas. Published on
  GitLab (leminnov/terraform/modules/scaleway-rdb); consumers pin a git tag
  (?ref=vX.Y.Z). Apache-2.0. OpenSpec was adopted after the first releases:
  openspec/specs/ describes the contract as released.

  Stack: HCL only. required_version >= 1.11.0 (write-only arguments).
  Provider pinned with ~> in versions.tf: scaleway/scaleway ~> 2.86. Every
  tool is pinned in mise.toml.

  Layout: main.tf holds every resource (instance, database, user, privilege,
  ACL, manual backup, read replica), named `this`; data.tf looks up the
  project by name; locals.tf resolves the project ID, converts the tags map to
  "key=value" and builds the engine helpers and output maps; versions.tf pins
  OpenTofu/Terraform and the provider; variables.tf is the whole input contract (grouped by theme, with
  validation blocks); outputs.tf exposes the instance, its endpoints and the
  created objects. checks.tf holds the plan-time check warnings; other guards are preconditions
  on scaleway_rdb_instance.this. Unit tests live in tests/main.tftest.hcl (mock
  provider). examples/minimal and examples/complete are the usage examples.

  Module-specific conventions (the generic ones are standards in the
  quality, repository and terraform stores, fetched on demand): the admin and
  user passwords have a write-only alternative (admin_user_password_wo and
  users[*].password_wo, versioned by admin_user_password_wo_version and
  users[*].password_wo_version) that is never stored in state; exactly one of
  the two forms is set; the module never configures a provider; tags are a
  map converted to "key=value"; README input/output tables are generated by
  terraform-docs between BEGIN_TF_DOCS/END_TF_DOCS; CHANGELOG.md is generated
  by git-cliff (mise run changelog, .cliff.toml) from commit subjects, not
  curated by hand: plain non-conventional subjects are kept, merge and
  changelog commits are skipped, so a commit subject reads as its CHANGELOG
  line and the release version follows semver.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test (unit tests in tests/main.tftest.hcl, mock provider, no account); pre-commit run -a;
  mise run changelog; mise run spec-validate.

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus *_wo_version) or justify why it cannot
  specs:
    - Write requirements against the module's observable contract (input shape, validation errors, resources produced, outputs, check warnings, empty second plan), not against provider internals
    - Give every validation block and every check block a scenario with the rejected or warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff and how existing state migrates (moved blocks, in-place update or forced replacement)
    - Keep provider {} and backend {} out of the module and never shell out to a CLI
  tasks:
    - Include unit tests in tests/main.tftest.hcl (a rejected-input run per new validation, a run per check), and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Include a commit subject that reads as the CHANGELOG.md line (git-cliff generates the file; regenerate it with mise run changelog at release), with upgrade notes in the commit body for anything breaking, and README updates when the compatibility matrix or the what-lands-in-state description changes
    - Reuse the existing capability directories under openspec/specs (module-contract, instances, databases-and-users, network-access, backups, read-replicas) instead of creating overlapping ones

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment
      - Run tofu fmt -recursive, tofu validate and tofu test after each task group and do not mark a task done while they fail
      - Do not run tofu apply against a real Scaleway account unless the user asked; say explicitly when it was skipped
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the commit subject reads as the CHANGELOG line (git-cliff generates CHANGELOG.md at release) and the terraform-docs README block was updated before archiving
      - Summarize which main specs changed and any requirement that was removed
